networks:
  app-network:
    driver: bridge
  postgres:
    driver: bridge

services:
  pg:
    image: postgres:17.2
    container_name: pg
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
    networks:
      - postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d task_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-tracker-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/task_tracker
    networks:
      - app-network
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped


volumes:
  postgres_data: